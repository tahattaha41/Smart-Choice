name: status-doc
on:
  push:
    branches: [main]
    paths-ignore: ['docs/STATUS.md', 'reports/**', '.blogger-*.json']
  schedule:
    - cron: '30 */12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: status-doc
  cancel-in-progress: true
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 30 }
      - run: python3 scripts/update_status.py
      - name: commit
        run: |
          git config user.name "smart-choice-bot"; git config user.email "bot@users.noreply.github.com"
          git add docs/STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: auto-update STATUS.md [skip ci]"
          git pull --rebase -X theirs origin main && git push
