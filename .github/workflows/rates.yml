name: Smart Choice | Reference FX rates

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-choice-rates
  cancel-in-progress: false

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_rates.py
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f assets/content/rates.json ] && git add assets/content/rates.json || true
          [ -f reports/rates-error.md ] && git add reports/rates-error.md || true
          git add -u reports assets/content
          git commit -m "chore: reference FX rates [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push origin HEAD:main && break; sleep 3; done
