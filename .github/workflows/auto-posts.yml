name: Smart Choice | New article every 12 hours

on:
  workflow_dispatch:
  schedule:
    - cron: "40 */12 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: smart-choice-blogger-sync-state
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Generate and validate an article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/generate_post.py
      - name: Commit and trigger publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts reports/auto-posts.md
          if git diff --cached --quiet; then exit 0; fi
          NEW=$(git diff --cached --name-only | grep -c '^posts/' || true)
          git commit -m "content: automatic article [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 3; done
          if [ "$NEW" -gt 0 ]; then
            python3 scripts/build_content_bundle.py
            git add assets/content && (git diff --cached --quiet || (git commit -m "chore: update content bundle [skip ci]" && git pull --rebase origin main && git push origin HEAD:main))
            gh api -X POST repos/${{ github.repository }}/actions/workflows/blogger-sync.yml/dispatches -f ref=main
          fi
