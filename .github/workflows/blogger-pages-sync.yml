name: Smart Choice | Sync static pages to Blogger

on:
  # Scheduled execution avoids relying only on push events from API-created commits.
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "scripts/blogger_pages_sync.py"
      - ".github/workflows/blogger-pages-sync.yml"

permissions:
  contents: write

concurrency:
  group: smart-choice-blogger-pages-sync
  cancel-in-progress: false

jobs:
  sync-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate page sources
        run: python scripts/blogger_pages_sync.py --dry-run
      - name: Sync static Blogger pages
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/blogger_pages_sync.py
      - name: Commit page sync state safely
        run: |
          if [ -n "$(git status --porcelain .blogger-pages-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .blogger-pages-state.json
            git commit -m "chore(smart-choice): update Blogger pages sync state [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
