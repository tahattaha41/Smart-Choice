name: Smart Choice | Live site browser test

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 * * *"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "pages/**"
      - "posts/**"
      - "scripts/live_e2e.mjs"
      - ".github/workflows/live-e2e.yml"

permissions:
  contents: write

concurrency:
  group: smart-choice-live-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - name: Wait for CDN and Blogger sync after a content push
        run: sleep 150
      - name: Run browser test against the live site
        run: node scripts/live_e2e.mjs
      - name: Commit report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live-e2e.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: live browser test report [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 2; done
          fi
