name: Sync posts to Blogger

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "scripts/blogger_sync.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blogger-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync posts
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          ALLOW_DELETE: ${{ vars.ALLOW_DELETE }}
        run: python scripts/blogger_sync.py

      - name: Commit sync state
        run: |
          if [ -n "$(git status --porcelain .blogger-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .blogger-state.json
            git commit -m "chore: update Blogger sync state [skip ci]"
            git push
          fi
