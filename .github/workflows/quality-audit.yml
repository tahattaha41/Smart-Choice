name: Smart Choice | Quality audit (AdSense)

on:
  push:
    branches: [main]
    paths: ["posts/**", "pages/**", "theme/**", "scripts/adsense_audit.py"]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-choice-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AdSense readiness audit (static + live)
        run: python scripts/adsense_audit.py --live
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/adsense-audit.json reports/adsense-audit.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: quality audit reports [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 3; done
            exit 1
          fi
