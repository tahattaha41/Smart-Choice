name: Smart Choice | Live site health check

on:
  workflow_dispatch:
  schedule:
    - cron: "40 5 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-health.yml"
      - "theme/**"
      - "pages/**"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public pages (verifies Blogger actually serves the content)
        run: |
          set +e
          ( # كل المخرجات تُحفظ في reports/site-health.txt
          base="https://smartchoicee1.blogspot.com"
          fail=0
          # بعد push الصفحات ننتظر قليلاً حتى تتزامن مع Blogger
          sleep 45
          check() { # url marker description
            body=""
            for attempt in 1 2 3 4 5 6; do
              body=$(curl -fsSL "$1" 2>/dev/null) && [ -n "$body" ] && break
              body=""; sleep $((attempt * 8))
            done
            sleep 4
            if [ -z "$body" ]; then echo "FAIL  $3: page not reachable ($1)"; fail=1; return; fi
            if printf '%s' "$body" | grep -q -- "$2"; then echo "OK    $3"; else echo "FAIL  $3: marker '$2' missing in $1"; fail=1; fi
          }
          check "$base/" "sc-hero" "Home renders hero (theme installed with content)"
          check "$base/p/smart-choice_02145436434.html" "sc-tabs" "Tools page renders tabs"
          check "$base/p/smart-choice_02092521556.html" "skyloom32" "Contact page shows email"
          check "$base/p/smart-choice.html" "Smart Choice" "About page"
          check "$base/p/smart-choice_01636960364.html" "الخصوصية" "Privacy page"
          check "$base/p/smart-choice_01037455191.html" "الشروط" "Terms page"
          check "$base/2026/10/blog-post_971.html" "الخصم" "Post: discount"
          check "$base/2026/10/blog-post_893.html" "ميزانية" "Post: budget"
          check "$base/2026/10/blog-post_82.html" "سعر الوحدة" "Post: unit price"
          check "$base/sitemap.xml" "<loc>" "Sitemap"
          check "$base/robots.txt" "Sitemap" "robots.txt"
          check "https://cdn.jsdelivr.net/gh/tahattaha41/Smart-Choice@main/assets/js/smart-choice.js" "sc-" "Front-end JS via CDN"
          echo "exit=$fail"
          ) 2>&1 | tee site-health.out
          mkdir -p reports; cp site-health.out reports/site-health.txt
          grep -q '^exit=0' site-health.out
      - name: Commit health report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/site-health.txt || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: live site health report [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 2; done
          fi
