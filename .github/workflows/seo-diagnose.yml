name: Smart Choice | SEO crawl diagnosis

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm init -y >/dev/null
          npm i playwright@1.49.0
          npx playwright install --with-deps chromium
      - run: node scripts/seo_diagnose.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/seo-diagnose.md
          git commit -m "chore: SEO crawl diagnosis [skip ci]" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 3; done
