name: Smart Choice | Sync posts to Blogger

on:
  push:
    branches: [main]
    paths:
      - "posts/**"
      - "scripts/blogger_sync.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: smart-choice-blogger-sync-state
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Smart Choice content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync Smart Choice posts to Blogger
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          ALLOW_DELETE: ${{ vars.ALLOW_DELETE }}
        run: python scripts/blogger_sync.py

      - name: Commit sync state
        run: |
          if [ -n "$(git status --porcelain .blogger-state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .blogger-state.json
            git commit -m "chore(smart-choice): update Blogger sync state [skip ci]"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              echo "Push conflict on attempt $attempt; retrying..."
              sleep 2
            done
            echo "Unable to push sync state after 5 attempts" >&2
            exit 1
          fi
