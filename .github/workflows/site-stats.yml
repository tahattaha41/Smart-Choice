name: Smart Choice | Visitor stats (Blogger API)

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/blogger_stats.py"]

permissions:
  contents: write

concurrency:
  group: smart-choice-site-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch page views
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/blogger_stats.py
      - name: Commit stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/stats.json reports/stats-history.json reports/stats-error.md 2>/dev/null || true; git add -u reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: visitor stats [skip ci]"
            for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 3; done
            exit 1
          fi
